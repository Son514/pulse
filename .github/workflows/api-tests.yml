name: API security tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:api

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
